<style>

.hud{position:fixed;top:0;left:0;right:0;padding:calc(16px + env(safe-area-inset-top,0px)) 22px 0;pointer-events:none;z-index:2}

.dock{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));overflow-x:auto;z-index:3}
.dock button{font:500 14px "Fredoka",sans-serif;color:var(--tx);box-shadow:0 2px 8px rgba(90,70,140,.12);background:var(--pn);border:1px solid var(--bd);border-radius:999px;padding:8px 18px;cursor:pointer;backdrop-filter:blur(8px);white-space:nowrap;transition:transform .15s,box-shadow .2s,border-color .2s}
.dock button:hover,.dock button:focus-visible{transform:translateY(-3px);border-color:var(--pk);box-shadow:0 6px 18px rgba(120,90,180,.25);outline:0}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--pn);backdrop-filter:blur(14px);border-left:1px solid var(--bd);z-index:4;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel.open{transform:none}
.bar{display:flex;align-items:center;gap:7px;padding:14px 18px;border-bottom:1px solid var(--bd)}
.bar i{width:12px;height:12px;border-radius:50%;background:var(--pk)}.bar i:nth-child(2){background:#ffcf6b}.bar i:nth-child(3){background:#6fdcb4}
.bar span{margin-left:8px;color:var(--mut);flex:1;font:500 13px "JetBrains Mono",monospace}
.bar button{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;width:32px;height:32px;font-size:18px;cursor:pointer}
.body{padding:20px 22px 30px;overflow-y:auto;flex:1}
.body h2{margin:6px 0 12px;font-size:24px;font-weight:600;color:var(--pu)}
.body p{margin:0 0 14px}
.pr{color:var(--mi);font-family:"JetBrains Mono",monospace}.cm{color:var(--mut)}
.st{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.st div{border:1px solid var(--bd);border-radius:16px;padding:10px 14px;color:var(--mut);font-size:13px;background:rgba(117,89,207,.05)}
.st b{display:block;color:var(--pk);font-size:26px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.c{border:1px solid var(--bd);border-radius:16px;padding:12px 14px;background:rgba(117,89,207,.05)}
.c h3{margin:0 0 4px;font-size:16px;color:var(--pu)}
.c p{margin:0;color:var(--mut);font-size:13.5px}
.t{display:inline-block;margin:6px 5px 0 0;padding:1px 10px;border-radius:999px;background:rgba(117,89,207,.12);font-size:12px;color:var(--pu)}
.job{border-left:3px solid var(--pk);padding:2px 0 2px 14px;margin:0 0 18px}
.job small{color:var(--am);font-weight:500}
.job h3{margin:2px 0 4px;font-size:16px}.job h3 em{font-style:normal;color:var(--pu)}
.job p{margin:0;color:var(--mut);font-size:13.5px}
.sk h3{margin:14px 0 4px;font-size:14px;color:var(--mi)}
.ct a{color:var(--pu);text-decoration:none;border-bottom:2px solid var(--pk)}
@media (max-width:760px){.panel{top:auto;width:100%;height:72%;border-left:0;border-top:1px solid var(--bd);border-radius:22px 22px 0 0;transform:translateY(105%)}.hint{bottom:calc(62px + env(safe-area-inset-bottom,0px))}.dock{justify-content:flex-start}}

function init(){
const T=THREE,cv=document.getElementById("gl");
const ren=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true,powerPreference:"high-performance"});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setClearColor(0,0);

const scene=new T.Scene(),cam=new T.PerspectiveCamera(38,1,.1,200);
scene.add(new T.HemisphereLight(0xffffff,0xbdb3dc,.5));scene.add(new T.AmbientLight(0xfff8f2,.06));
const sun=new T.DirectionalLight(0xfff4ea,.5);sun.position.set(4,14,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10,near:1,far:40});sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;scene.add(sun);

const world=new T.Group(),room=new T.Group();scene.add(world);room.position.y=.42;world.add(room);
const pl=(c,i,d,x,y,z)=>{const l=new T.PointLight(c,i,d);l.position.set(x,y,z);room.add(l)};
pl(0xffd29a,.28,6,-2.4,2.5,-1.9);pl(0xe6dcff,.18,9,0,3.6,-1.4);
const mesh=(g,m,x,y,z,p)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;(p||room).add(o);return o};
const GC={};
function RBG(w,h,d,r){r=Math.min(r,w/2,h/2,d/2)*.98;const key="b"+[w,h,d,r];if(GC[key])return GC[key];
  const k=3,N=2*k+1,g=new T.BoxGeometry(1,1,1,N,N,N),p=g.attributes.position,nm=g.attributes.normal,H=[w/2,h/2,d/2];
  const f=(t,hh)=>{const i=Math.round((t+.5)*N);return i<=k?-hh+r*(i/k):hh-r*((N-i)/k)};
  for(let i=0;i<p.count;i++){const v=[f(p.getX(i),H[0]),f(p.getY(i),H[1]),f(p.getZ(i),H[2])],q=v.map((a,j)=>Math.max(-H[j]+r,Math.min(H[j]-r,a))),dv=v.map((a,j)=>a-q[j]),L=Math.hypot(dv[0],dv[1],dv[2])||1;
    p.setXYZ(i,q[0]+dv[0]/L*r,q[1]+dv[1]/L*r,q[2]+dv[2]/L*r);nm.setXYZ(i,dv[0]/L,dv[1]/L,dv[2]/L)}
  g.computeBoundingSphere();return GC[key]=g}
const RB=(w,h,d,r,m,x,y,z,p)=>mesh(RBG(w,h,d,r),m,x,y,z,p);
const sphG=r=>GC["s"+r]||(GC["s"+r]=new T.SphereGeometry(r,28,20));
const Sp=(r,m,x,y,z,p,sx,sy,sz)=>{const o=mesh(sphG(r),m,x,y,z,p);o.scale.set(sx||1,sy||1,sz||1);return o};
const Cy=(rt,rb,h,m,x,y,z,p)=>mesh(new T.CylinderGeometry(rt,rb,h,24),m,x,y,z,p);
const lathe=(pts,seg)=>new T.LatheGeometry(pts.map(q=>new T.Vector2(q[0],q[1])),seg||32);
function RCG(r,h,rr){const key="c"+[r,h,rr];if(GC[key])return GC[key];const P=[[0,-h/2]];for(let i=0;i<=6;i++){const a=-Math.PI/2+i/6*Math.PI/2;P.push([r-rr+Math.cos(a)*rr,-h/2+rr+Math.sin(a)*rr])}for(let i=0;i<=6;i++){const a=i/6*Math.PI/2;P.push([r-rr+Math.cos(a)*rr,h/2-rr+Math.sin(a)*rr])}P.push([0,h/2]);return GC[key]=lathe(P,44)}
const RC=(r,h,rr,m,x,y,z,p)=>mesh(RCG(r,h,rr),m,x,y,z,p);
function CapG(r,l,top){const P=[];for(let i=0;i<=8;i++){const a=-Math.PI/2+i/8*Math.PI/2;P.push([Math.cos(a)*r,-l/2+Math.sin(a)*r])}for(let i=0;i<=8;i++){const a=i/8*Math.PI/2;P.push([Math.cos(a)*r,l/2+Math.sin(a)*r])}const g=lathe(P,22);if(top)g.translate(0,-l/2,0);return g}
const Cap=(r,l,m,x,y,z,p)=>mesh(CapG(r,l),m,x,y,z,p);
const tex=(w,h,fn)=>{const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");fn(x,w,h);const t=new T.CanvasTexture(c);t.userData={c,x};return t};
const flat=(w,h,m,x,y,z,p)=>{const o=new T.Mesh(new T.PlaneGeometry(w,h),m);o.position.set(x,y,z);o.receiveShadow=true;(p||room).add(o);return o};
const rr=(x,a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
const heart=(x,cx,cy,s)=>{x.beginPath();x.moveTo(cx,cy+s*.42);x.bezierCurveTo(cx-s*1.15,cy-s*.3,cx-s*.5,cy-s*1.1,cx,cy-s*.45);x.bezierCurveTo(cx+s*.5,cy-s*1.1,cx+s*1.15,cy-s*.3,cx,cy+s*.42);x.fill()};
const woodTex=(c1,c2,rp)=>{const t=tex(256,256,(x,W,H)=>{x.fillStyle=c1;x.fillRect(0,0,W,H);for(let i=0;i<44;i++){x.strokeStyle=c2;x.globalAlpha=.1+((i*37)%10)/45;x.lineWidth=1+(i*13)%3;const y=(i*53)%H;x.beginPath();x.moveTo(0,y);for(let k=0;k<=8;k++)x.lineTo(k*W/8,y+Math.sin(k*1.3+i)*3);x.stroke()}x.globalAlpha=1});t.wrapS=t.wrapT=T.RepeatWrapping;if(rp)t.repeat.set(rp[0],rp[1]);return t};
const FR='"Fredoka",sans-serif',MO='"JetBrains Mono",monospace',INK="#4a3d66";
/* palette (taken from the reference: white walls, honey wood, lilac furniture, periwinkle base) */
const beam=M(0xffffff,{map:woodTex("#d9a774","#8f5e36",[2,1])}),wood=M(0xffffff,{map:woodTex("#e6bf90","#a87a4e")}),
  white=M(0xfbf9fd),wallM=M(0xf3eff8),lil=M(0xdccff5),lilD=M(0xc2b2ec),lilL=M(0xece5fb),ink=M(0x3b3550),
  grass=M(0x86c77a),grassD=M(0x62ad5f),stone=M(0xe4e3ea),moss=M(0x93c878),pink=M(0xf6b8cf),mint=M(0xb5e6d2),butter=M(0xf7df9e);

/* ===== base: periwinkle slab + white plinth ===== */
const slab=RC(7.1,.34,.16,M(0xa9b9ea),0,-.05,0,world);slab.scale.z=.94;
RB(6.75,.44,6.75,.1,white,0,.2,0,world);
/* stones with moss, grass blades */
[[4.4,4.0,.5],[-4.6,-3.0,.55],[2.0,5.3,.42],[-1.6,5.4,.36],[5.2,.9,.4],[-4.2,3.6,.38]].forEach((q,i)=>{const o=Sp(1,stone,q[0],.12+q[2]*.18,q[1],world,q[2],q[2]*.48,q[2]*.78);o.rotation.y=i*1.3;
  const m=Sp(1,moss,q[0]+q[2]*.15,.12+q[2]*.6,q[1]-q[2]*.1,world,q[2]*.55,q[2]*.18,q[2]*.45);m.rotation.y=i});
const leaves=[];
const bladeG=new T.ConeGeometry(.09,1,5);bladeG.translate(0,.5,0);
[[-4.1,4.6,5],[3.5,4.9,4],[5.4,2.3,3],[-5.2,-1.2,4],[4.8,-3.6,3],[-.4,5.8,3],[-3.6,-4.6,3]].forEach((q,i)=>{const g=new T.Group();g.position.set(q[0],.12,q[1]);world.add(g);
  for(let j=0;j<q[2];j++){const b=mesh(bladeG,j%2?grass:grassD,(j-q[2]/2)*.09,0,((j*7)%3-1)*.06,g);b.scale.set(1,.45+((i+j*5)%4)*.14,.3);b.rotation.set(((j*3)%3-1)*.12,j,(j-q[2]/2)*.16)}leaves.push(g)});

/* ===== room shell ===== */
RB(6.4,4.0,.26,.07,wallM,0,2.0,-3.17);RB(.26,4.0,6.4,.07,wallM,-3.17,2.0,.03);
RB(7.5,.38,1.0,.09,beam,.25,4.18,-3.02);RB(1.0,.38,7.3,.09,beam,-3.02,4.18,.4);
RB(6.0,.12,.05,.02,white,.1,.06,-3.02);RB(.05,.12,6.0,.02,white,-3.02,.06,.1);
const fl=tex(512,512,(x,W,H)=>{for(let i=0;i<10;i++){x.fillStyle=["#e3bf92","#dbb487","#e8c79c"][i%3];x.fillRect(i*W/10,0,W/10,H);x.fillStyle="rgba(140,95,60,.4)";x.fillRect(i*W/10,0,2,H);x.fillRect(i*W/10,(i*173)%H,W/10,2);x.fillRect(i*W/10,(i*173+260)%H,W/10,2)}});
flat(6.1,6.1,M(0xffffff,{map:fl}),-.03,.005,-.03).rotation.x=-Math.PI/2;
const rug=tex(512,256,(x,W,H)=>{x.fillStyle="#b9a6ea";rr(x,4,4,W-8,H-8,46);x.fill();x.setLineDash([14,10]);x.strokeStyle="rgba(255,255,255,.85)";x.lineWidth=5;rr(x,24,24,W-48,H-48,32);x.stroke();x.setLineDash([]);x.fillStyle="#fff";x.font=`600 50px ${FR}`;x.textAlign="center";x.textBaseline="middle";x.fillText("hello, world",W/2,H/2+3)});
flat(2.5,1.25,M(0xffffff,{map:rug,transparent:true}),1.05,.02,1.85).rotation.x=-Math.PI/2;

/* ===== desk ===== */
RB(4.2,.12,1.3,.04,wood,-.85,1.19,-2.35);
RB(1.3,1.13,1.15,.06,lil,-2.3,.565,-2.4);RB(.12,1.13,1.15,.04,white,1.15,.565,-2.4);
[.24,.58,.92].forEach(y=>{RB(1.14,.3,.04,.03,lilL,-2.3,y,-1.82);RB(.3,.035,.035,.015,white,-2.3,y+.06,-1.78)});
const scrA=tex(560,230,()=>{}),monB=RB(2.62,1.08,.1,.05,white,-.85,2.02,-2.72);
flat(2.48,.94,bas(0xffffff,{map:scrA}),-.85,2.03,-2.665);
RB(.16,.42,.1,.04,white,-.85,1.47,-2.75);RC(.36,.05,.02,white,-.85,1.275,-2.7);
const scrC=tex(230,380,()=>{}),vm=new T.Group();vm.position.set(.95,1.95,-2.55);vm.rotation.y=-.3;room.add(vm);
RB(.86,1.36,.08,.04,white,0,0,0,vm);flat(.76,1.24,bas(0xffffff,{map:scrC}),0,0,.045,vm);RB(.1,.4,.08,.03,white,0,-.82,-.02,vm);RC(.26,.05,.02,white,0,-1.02,0,vm);
const scrK=tex(256,86,()=>{});RB(1.06,.06,.37,.025,white,-.85,1.28,-1.88);flat(.98,.3,bas(0xffffff,{map:scrK}),-.85,1.312,-1.88).rotation.x=-Math.PI/2;

  const tmp=RB(.014,.014,.24,.006,blk,s*.175,.0,.14,head);tmp.rotation.y=s*.12;
  Sp(.04,bas(0xf29a9a,{transparent:true,opacity:.22}),s*.15,-.08,.21,head,1,.6,.35)});
RB(.04,.014,.014,.006,blk,0,.0,.272,head);
Sp(.032,M(0xeab18f),0,-.075,.245,head,.95,.8,.9);
const mo=mesh(new T.TorusGeometry(.024,.006,6,14,Math.PI),M(0x9a5a52),0,-.14,.22,head);mo.rotation.z=Math.PI;mo.scale.set(1,.55,1);

/* thought bubble (architecture sketch -> lightbulb) */
const bt=tex(420,260,()=>{});const bub=new T.Sprite(new T.SpriteMaterial({map:bt,transparent:true,depthWrite:false}));bub.position.set(.15,3.7,-.75);bub.scale.set(0,0,1);bub.renderOrder=20;room.add(bub);
const dots=[[-.6,2.35,-1.2,.06],[-.3,2.85,-1.02,.09]].map(d=>{const o=Sp(d[3],bas(0xffffff),d[0],d[1],d[2],room);o.castShadow=false;o.scale.setScalar(0);return o});
function drawBubble(t,k){const{c,x}=bt.userData,W=c.width,H=c.height;x.clearRect(0,0,W,H);const cs2=[[110,130,72],[190,92,80],[275,95,76],[338,138,66],[262,180,70],[160,180,70]];
  x.fillStyle="#cfc4ef";cs2.forEach(a=>{x.beginPath();x.arc(a[0],a[1],a[2]+5,0,7);x.fill()});x.fillStyle="#fff";cs2.forEach(a=>{x.beginPath();x.arc(a[0],a[1],a[2],0,7);x.fill()});
  const bx=[[110,"API","#e9e1fb"],[210,"MQ","#fbe6ef"],[310,"DB","#dff5ec"]];x.textAlign="center";x.textBaseline="middle";
  x.strokeStyle="#a99ad6";x.lineWidth=4;[[145,175],[245,275]].forEach(a=>{x.beginPath();x.moveTo(a[0],150);x.lineTo(a[1],150);x.stroke()});
  const dp=(t*1.2)%1,dx=dp<.5?145+dp*2*30:245+(dp-.5)*2*30;x.fillStyle="#7a63c9";x.beginPath();x.arc(dx,150,6,0,7);x.fill();
  bx.forEach(b=>{x.fillStyle=b[2];rr(x,b[0]-34,128,68,44,12);x.fill();x.fillStyle=INK;x.font=`600 22px ${FR}`;x.fillText(b[1],b[0],151)});
  const on=k>.55;x.fillStyle=on?"#ffd65c":"#e6e2ee";if(on){x.shadowColor="#ffd65c";x.shadowBlur=24}x.beginPath();x.arc(210,70,22,0,7);x.fill();x.shadowBlur=0;x.fillStyle="#b9b2c8";x.fillRect(201,90,18,10);bt.needsUpdate=true}

/* code screens */
const cA=[["public async Task Approve(int id)","#ffb3d1"],["{","#f3eeff"],["  var f = await _wf.Next(id);","#9ef0c8"],["  if (f.Done) _claim.Close(id);","#ffd98a"],["}","#f3eeff"],["mqtt.Subscribe(\"plc/modbus/#\");","#c9b6ff"],["await scale.ReadAsync(\"COM3\");","#ffd98a"],["docker compose up -d --build","#9ef0c8"],["az pipelines run -n deploy","#ffb3d1"],["git push origin main","#9ef0c8"],["// ship it","#c9b6ff"]];
const cB=[["$ systemctl status erp-api","#9ef0c8"],["● active (running)","#e2fff3"],["$ tail -f modbus.log","#9ef0c8"],["PLC#3 read ok 12.4kg","#c4f7de"],["MQTT  plc/yard  connected","#c4f7de"],["$ docker ps","#9ef0c8"],["erp-web   Up 14 days","#e2fff3"],["erp-api   Up 14 days","#e2fff3"],["pipeline  #482  passed","#c4f7de"],["_","#9ef0c8"]];
const cC=[["* a1f3 fix approval","#ffb3d1"],["| * 9be2 add claim","#9ef0c8"],["|/","#b3a8d8"],["* 7c41 qc module","#ffd98a"],["* 3d90 ci/cd","#c9b6ff"],["* e5a2 item master","#9ef0c8"],["* 1b77 agv api","#ffb3d1"],["* 04cc init","#b3a8d8"]];
function drawCode(t,tm,sz,L,bg){const{c,x}=t.userData;x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);x.font=`700 ${sz}px ${MO}`;x.textBaseline="top";const lh=sz*1.65,n=L.length,off=(tm*sz*1.1)%(n*lh);for(let k=0;k<n*2+2;k++){const y=k*lh-off+6;if(y<-lh||y>c.height)continue;const l=L[k%n];x.fillStyle=l[1];x.fillText(l[0],12,y)}t.needsUpdate=true}
function drawKeys(t,tm){const{c,x}=t.userData;x.fillStyle="#f4f1fa";x.fillRect(0,0,c.width,c.height);const pc=["#ffffff","#e4dbfa","#fbe1ec","#dff3ea"];for(let r=0;r<5;r++)for(let k=0;k<15;k++){x.fillStyle=pc[(r*3+k+(Math.floor(tm*6)%15===k?1:0))%4];rr(x,6+k*16.4,6+r*15.6,12.5,11.5,3);x.fill()}t.needsUpdate=true}

/* ===== wooden signpost (like the reference) ===== */
const sign=new T.Group();sign.position.set(5.5,.12,-1.9);sign.rotation.y=.74;world.add(sign);
RB(.2,3.7,.2,.05,beam,0,1.85,0,sign);RB(.32,.12,.32,.04,beam,0,3.72,0,sign);
function plank(d){const L=1.85,H=.42,t=.18,r=.08,a=-.12,s=new T.Shape();s.moveTo(a*d,-H/2+r);s.quadraticCurveTo(a*d,-H/2,(a+r)*d,-H/2);s.lineTo((L-t)*d,-H/2);s.lineTo(L*d,0);s.lineTo((L-t)*d,H/2);s.lineTo((a+r)*d,H/2);s.quadraticCurveTo(a*d,H/2,a*d,H/2-r);s.closePath();
  return new T.ExtrudeGeometry(s,{depth:.06,bevelEnabled:true,bevelThickness:.025,bevelSize:.025,bevelSegments:3,curveSegments:6})}
const boards=[];
[["projects","MY WORK",1],["about","ABOUT",-1],["contact","CONTACT",1]].forEach((b,i)=>{
  const m=mesh(plank(b[2]),M(0xffffff,{map:woodTex("#e7c296","#a8784a",[.6,.6]),emissive:0x000000}),0,3.3-i*.62,.12,sign);m.rotation.y=b[2]*.05;m.rotation.z=(i-1)*.03;m.userData={key:b[0]};
  const lt=tex(512,128,(x,W,H)=>{x.fillStyle="#6e4527";x.font=`600 66px ${FR}`;x.textAlign="center";x.textBaseline="middle";x.fillText(b[1],W/2,H/2+4)});
  const tp=new T.Mesh(new T.PlaneGeometry(1.4,.35),bas(0xffffff,{map:lt,transparent:true}));tp.position.set(b[2]*.85,0,.091);m.add(tp);boards.push(m)});
const hot=[monB,rkB,kbB];monB.userData={key:"projects"};rkB.userData={key:"skills"};kbB.userData={key:"experience"};

/* interaction */
function size(){const w=innerWidth,h=innerHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
size();addEventListener("resize",size);
const rc=new T.Raycaster(),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),sm=u=>u*u*(3-2*u);
let drag=false,sx=0,sy=0,ty=0,tp=0,moved=0,px=0,py=0,hov=null,yaw=0,pit=0,tx=0,hasPtr=false;
const pick=()=>{rc.setFromCamera({x:px,y:py},cam);const h=rc.intersectObjects(boards.concat(hot),false)[0];return h?h.object:null};
cv.addEventListener("pointerdown",e=>{drag=true;sx=e.clientX;sy=e.clientY;moved=0;cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing"});
cv.addEventListener("pointermove",e=>{hasPtr=true;px=e.clientX/innerWidth*2-1;py=-(e.clientY/innerHeight)*2+1;if(drag){const dx=e.clientX-sx,dy=e.clientY-sy;moved+=Math.abs(dx)+Math.abs(dy);ty=clamp(ty-dx*.005,-.9,.9);tp=clamp(tp+dy*.004,-.25,.35);sx=e.clientX;sy=e.clientY}});
cv.addEventListener("pointerup",e=>{drag=false;cv.style.cursor="grab";if(moved<6){px=e.clientX/innerWidth*2-1;py=-(e.clientY/innerHeight)*2+1;const b=pick();b?openP(b.userData.key):closeP()}});

/* ===== story timeline (24 s loop) =====
   0-6 coding · 6-7 turns around · 7-10 thinks (bubble) · 9.6 dog wakes · 10.3-11.9 runs over
   12-15 pets the dog · 15-16 back to coding · 15.3-16.9 dog runs back · 16.9-17.7 lies down on the cloud */
const V=(x,y,z)=>new T.Vector3(x,y,z),down=V(0,-1,0),tmpQ=new T.Quaternion(),tmpQ2=new T.Quaternion();
const seg=(u,a,b)=>sm(clamp((u-a)/(b-a),0,1));
const lerpV=(a,b,k)=>a.clone().lerp(b,k);
const angLerp=(a,b,k)=>{let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI;return a+d*k};
/* where the dog sits while being petted: in front of the turned chair, slightly to the petting hand's side */
const fw=V(Math.sin(CH_TURN),0,Math.cos(CH_TURN)),rt=V(Math.cos(CH_TURN),0,-Math.sin(CH_TURN));
const PET=CH.clone().addScaledVector(rt,.34).addScaledVector(fw,.8);
const yawTo=(a,b)=>Math.atan2(-(b.z-a.z),b.x-a.x);
const Y_SLEEP=.6,Y_GO=yawTo(CLOUD,PET),Y_FACE=Math.atan2(fw.z,-fw.x),Y_BACK=yawTo(PET,CLOUD);
const LIE=[0,.13,0,1.45,-1.4,-.22,.06,1],STAND=[0,.3,0,0,0,.12,.13,1],SIT=[-.06,.22,.7,-.7,.87,-.38,.13,1.2];
const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
/* analytic two-bone IK so hands land exactly on keyboard / chin / the dog's head */
const A1=.3,A2=.3;
function ik(a,Pw){const S=a.sh.getWorldPosition(V()),dir=Pw.clone().sub(S);const d=clamp(dir.length(),.08,A1+A2-.002);dir.normalize();
  const pole=V(a.s*.9,-.45,-.9).transformDirection(tg.matrixWorld);let n=V().crossVectors(dir,pole);if(n.lengthSq()<1e-6)n.set(1,0,0);n.normalize();
  const al=Math.acos(clamp((A1*A1+d*d-A2*A2)/(2*A1*d),-1,1)),u=dir.clone().applyAxisAngle(n,al),E=S.clone().addScaledVector(u,A1),f=Pw.clone().sub(E).normalize();
  setBone(a.sh,u,n);setBone(a.el,f,n)}
const mB=new T.Matrix4(),qW=new T.Quaternion();
function setBone(o,dirW,xAx){const y=dirW.clone().negate(),x=xAx.clone().addScaledVector(y,-xAx.dot(y)).normalize(),z=V().crossVectors(x,y);mB.makeBasis(x,y,z);qW.setFromRotationMatrix(mB);o.parent.getWorldQuaternion(tmpQ);o.quaternion.copy(tmpQ.invert().multiply(qW))}
const still=matchMedia("(prefers-reduced-motion: reduce)").matches,clk2=new T.Clock();let last=0,lt2=0;
(function loop(){
  requestAnimationFrame(loop);
  const t=clk2.getElapsedTime(),U=still?3:t%24,mv=still?0:1;
  /* --- owner --- */
  const turn=seg(U,6,7)*(1-seg(U,15,16)),think=seg(U,7,7.6)*(1-seg(U,9.5,10.1)),pet=seg(U,12.1,12.7)*(1-seg(U,14.5,15));
  chair.rotation.y=Math.PI-(Math.PI-CH_TURN)*turn;
  tg.rotation.x=(.1+(-.16)*turn)*(1-pet)+.75*pet;
  head.rotation.set(-.06*(1-turn)+(-.2)*think+.12*pet+Math.sin(t*2.1)*.02*mv*(1-turn),-.22*think+Math.sin(t*.7)*.05*mv*(1-turn),.1*think);
  const blink=(t%4.6)<.12&&!still;eyes.forEach(e=>e.scale.y=blink?.12:1);
  /* --- dog --- */
  const wake=seg(U,9.6,10.3),lie=seg(U,16.9,17.7),up=clamp(wake-lie,0,1),sit=seg(U,11.9,12.3)*(1-seg(U,14.8,15.2));
  const go=seg(U,10.3,11.9),back=seg(U,15.3,16.9);
  let p=CLOUD.clone(),hop=.2;
  if(U>=10.3&&U<15.3){p=lerpV(CLOUD,PET,go);const k=clamp((U-10.3)/.5,0,1);hop=.2*(1-k)+Math.sin(Math.PI*k)*.12}
  else if(U>=15.3&&U<17.7){p=lerpV(PET,CLOUD,back);const k=clamp((U-16.4)/.5,0,1);hop=.2*k+Math.sin(Math.PI*k)*.12}
  const run=(U>10.3&&U<11.9?Math.sin(Math.PI*(U-10.3)/1.6):0)+(U>15.3&&U<16.9?Math.sin(Math.PI*(U-15.3)/1.6):0);
  dog.position.set(p.x,hop+Math.abs(Math.sin(t*20))*.03*run,p.z);
  let yw=Y_SLEEP;yw=angLerp(yw,Y_GO,seg(U,10,10.4));yw=angLerp(yw,Y_FACE,seg(U,11.6,12.1));yw=angLerp(yw,Y_BACK,seg(U,14.9,15.4));yw=angLerp(yw,Y_SLEEP,seg(U,16.8,17.5));dog.rotation.y=yw;
  const P=mix(mix(LIE,STAND,up),SIT,sit);
  dB.position.set(P[0],P[1],0);dB.rotation.z=P[2];dH.position.y=P[6];dH.rotation.z=P[5]+(pet>.5?Math.sin(t*3)*.06:0);
  const ph=[0,Math.PI,Math.PI,0];dLegs.forEach((l,i)=>{l.rotation.z=(i<2?P[3]:P[4])+Math.sin(t*20+ph[i])*.75*run;l.scale.y=i<2?P[7]:1});
  tail.rotation.y=Math.sin(t*(up>.5?(pet>.3?18:10):1.2))*(up>.5?.45:.08)*mv;
  const happy=pet>.4;eyeO.visible=up>.5&&!happy;eyeC.visible=up<=.5;eyeH.visible=up>.5&&happy;
  /* --- arms: typing / thinking / petting, solved with IK --- */
  room.updateMatrixWorld(true);
  const dogHead=dH.getWorldPosition(V()).add(V(0,.17,0)).addScaledVector(fw,Math.sin(t*6)*.035);
  arms.forEach((a,i)=>{const jit=mv*(1-turn);let L=V(a.s*.15+Math.sin(t*3.1+i)*.025*jit,1.37+Math.max(0,Math.sin(t*19+i*2.1))*.025*jit,.38);
    L.lerp(V(a.s*.15,.98,.36),turn);let W=dev.localToWorld(L);
    if(a.s<0)W.lerp(head.localToWorld(V(-.03,-.27,.14)),think);else W.lerp(dogHead,pet);
    ik(a,W);a.hd.rotation.z=a.s*-1.0*((1-turn)*(1-pet)+.5*pet)});
  /* thought bubble */
  const bs=seg(U,7.3,7.8)*(1-seg(U,9.6,9.9));bub.scale.set(2.4*bs,1.48*bs,1);dots.forEach((d,i)=>d.scale.setScalar(sm(clamp(bs*1.4-i*.3,0,1))));bub.position.y=3.7+Math.sin(t*2)*.04;
  if(bs>0&&t-last>.07){last=t;drawBubble(t,clamp((U-7.3)/2.2,0,1))}
  /* zz while asleep, hearts while petted */
  zz.forEach((z,i)=>{const q=((t*.25+i/3)%1);z.position.set(CLOUD.x+.1+q*.25,.75+q*.9,CLOUD.z+.15+q*.15);z.material.opacity=Math.sin(q*Math.PI)*(1-up)*(still?.6:1)});
  const hp=room.worldToLocal(dH.getWorldPosition(V()));hearts.forEach((h,i)=>{const q=((t*.7+i/3)%1);h.position.set(hp.x+Math.sin(i*2.1+t)*.12,hp.y+.25+q*.55,hp.z+Math.cos(i*2.1)*.1);h.material.opacity=Math.sin(q*Math.PI)*clamp(pet*1.5-.4,0,1)});
  /* ambient bits */
  if(t-lt2>.09){lt2=t;drawCode(scrA,t,22,cA,"#2a2540");drawCode(scrB,t*.7,24,cB,"#1d3833");drawCode(scrC,t*.5,22,cC,"#29243c");drawKeys(scrK,t)}
  leds.forEach(l=>l.m.color.set(Math.sin(t*3+l.o*1.7)>.2?0x9ef0c8:l.o%3?0xffd98a:0xffa6c8));
  bulbs.forEach((m,i)=>m.color.setHSL(.12,1,.86+Math.sin(t*2+i)*.05*mv));
  const d=new Date(),mm=d.getMinutes()+d.getSeconds()/60;hM.rotation.z=-mm/60*6.283;hH.rotation.z=-((d.getHours()%12)+mm/60)/12*6.283;
  leaves.forEach((l,i)=>l.rotation.z=Math.sin(t*1.2+i)*.05*mv);
  /* camera */
  const asp=cam.aspect,Rr=asp<.8?38:asp<1.3?22:17.5;
  tx+=((isOpen&&asp>1.2?3.2:asp<.8?1.3:0)-tx)*.06;
  yaw+=((ty+px*.06*(hasPtr?1:0))-yaw)*.06;pit+=((tp+py*.03)-pit)*.06;
  const az=.74+yaw,el=.46+pit,tgt=new T.Vector3(tx*Math.cos(az),2.1,-tx*Math.sin(az));
  cam.position.set(tgt.x+Math.sin(az)*Math.cos(el)*Rr,tgt.y+Math.sin(el)*Rr,tgt.z+Math.cos(az)*Math.cos(el)*Rr);cam.lookAt(tgt);
  if(!drag&&hasPtr){const h=pick();if(h!==hov){hov=h;cv.style.cursor=h?"pointer":"grab"}}
  boards.forEach(b=>{const on=b===hov,k=b.scale.x+((on?1.08:1)-b.scale.x)*.18;b.scale.set(k,k,k);b.material.emissive.setHex(on?0x2a1a08:0)});
  ren.render(scene,cam);
})();
}
